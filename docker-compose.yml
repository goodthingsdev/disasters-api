services:
  postgres:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_DB: disasters_test
      POSTGRES_USER: disasters
      POSTGRES_PASSWORD: disasters_pass
      POSTGRES_HOST_AUTH_METHOD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
  api:
    build: .
    depends_on:
      - postgres
    environment:
      - POSTGRES_URI=postgresql://disasters:disasters_pass@postgres:5432/disasters_test
      - NODE_ENV=development
    ports:
      - '3000:3000'
    restart: always
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
